<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheese hunt</title>
<style>
  body { font: 14px ui-monospace, Consolas, monospace; background: #111; color: #ddd; padding: 16px; }
  .ok { color: #7fdc8a; } .bad { color: #ff7b72; } .warn { color: #ffd35a; }
</style>
</head>
<body>
<h1>Cheese hunt: random echoes and random play</h1>
<pre id="out">running...</pre>
<script src="../js/levels.js"></script>
<script src="../js/engine.js"></script>
<script src="bot.js"></script>
<script>
  // A random player records a few random echoes, then plays a random final run. Any win it finds is a candidate
  // cheese (or a level that is too easy). ?only=3,5 picks levels by index, ?secs=8 sets the time per level,
  // ?seed=7 changes the random stream, ?trial=SEED&only=3 replays one trial and prints its recordings.
  const P = new URLSearchParams(location.search);
  const only = (P.get("only") || "").split(",").filter(Boolean).map(Number);
  const secs = Number(P.get("secs") || 8);
  const seed0 = Number(P.get("seed") || 1);
  const one = P.get("trial");
  const EVERY = Number(P.get("every") || 15);
  window.RESULTS = [];

  function mulberry(a) {
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // Play `ticks` ticks of random keys. mode: 0 stand, 1 short walks, 2 wander toward the exit.
  function play(r, ticks, mode, log) {
    const L = G.L;
    const ex = L.exit ? L.exit.x + L.exit.w / 2 : 600;
    let dir = 0, left = 0, hold = 0;
    for (let i = 0; i < ticks; i++) {
      if (left <= 0) {
        const toward = Math.sign(ex - Bot.px());
        if (mode === 0) dir = 0;
        else if (mode === 1) dir = r() < 0.5 ? toward : r() < 0.5 ? -toward : 0;
        else dir = r() < 0.6 ? toward : r() < 0.5 ? -toward : 0;
        left = 4 + Math.floor(r() * (mode === 0 ? 80 : 50));
      }
      left--;
      Bot.dir(dir);
      if (hold > 0) { hold--; if (hold === 0) Bot.jumpKey(false); }
      else if (mode > 0 && r() < 0.05) { Bot.jumpKey(true); hold = 3 + Math.floor(r() * 28); }
      if (L.swap && mode > 0 && r() < 0.012) {
        if (L.echoes.length > 1 && r() < 0.5) Bot.select(Math.floor(r() * L.echoes.length));
        Bot.swap();
        if (log) log.push("swap@" + i);
      }
      Bot.tick();
      if (log && i % EVERY === 0) log.push("  t" + G.t + " x" + Math.round(G.p.x) + " y" + Math.round(G.p.y) + (G.p.stand ? " on " + G.p.stand.key : "") + " | " + Object.values(G.echoes).map((e) => e.key + "@" + Math.round(e.x) + "," + Math.round(e.y) + (e.dy ? " dy" + Math.round(e.dy) : "")).join(" "));
      if (G.won) return "won";
      if (G.dead) return "dead";
    }
    Bot.jumpKey(false); Bot.dir(0);
    return "alive";
  }

  function trial(idx, seed, verbose) {
    const r = mulberry(seed);
    const L0 = LEVELS[idx];
    Bot.load(idx);
    const slots = G.L.echoes.length;
    const nrec = slots ? 1 + Math.floor(r() * Math.min(5, slots * 2)) : 0;
    const log = verbose ? [] : null;
    let used = 0;
    for (let k = 0; k < nrec; k++) {
      const slot = Math.floor(r() * slots);
      const mode = Math.floor(r() * 3);
      const T = 40 + Math.floor(r() * 260);
      Bot.record(slot);
      const res = play(r, T, mode, log);
      if (res === "won") return { won: true, rec: used, log };
      if (res === "dead") { for (let i = 0; i < 60 && G.dead; i++) Bot.tick(); if (log) log.push("rec " + slot + " mode " + mode + " T " + T + " died"); continue; }
      Bot.stop();
      used++;
      if (log) log.push("rec " + G.L.slotKeys[slot] + " mode " + mode + " T " + T);
    }
    // let them settle a random while, then the final run
    Bot.run(Math.floor(r() * 120));
    const res = play(r, 700, 2, log);
    return { won: res === "won", rec: used, log };
  }

  if (P.get("dbg")) {
    const orig = stepPlayer;
    window.stepPlayer = function () {
      const y0 = G.p.y, st0 = G.p.stand && G.p.stand.key, vy0 = G.p.vy;
      orig();
      if (window.DBG && G.p.y < 215 && G.p.y > 150) window.DBG.push("t" + G.t + " y " + y0.toFixed(1) + " -> " + G.p.y.toFixed(1) + " vy " + vy0.toFixed(0) + "->" + G.p.vy.toFixed(0) + " stand " + st0 + "->" + (G.p.stand && G.p.stand.key) + " ground " + G.p.onGround);
    };
    window.DBG = [];
  }
  let html = "";
  for (let idx = 0; idx < LEVELS.length; idx++) {
    if (only.length && !only.includes(idx)) continue;
    if (one !== null) {
      const t = trial(idx, Number(one), true);
      if (window.DBG) html += window.DBG.join(String.fromCharCode(10)) + String.fromCharCode(10);
      html += idx + " " + LEVELS[idx].name + " trial " + one + ": " + (t.won ? "WON" : "no") + "\n" + t.log.join("\n") + "\n";
      continue;
    }
    const t0 = performance.now();
    let n = 0, wins = 0, minRec = 99, firstSeed = null;
    while (performance.now() - t0 < secs * 1000) {
      const seed = seed0 * 100000 + n;
      const t = trial(idx, seed, false);
      n++;
      if (t.won) { wins++; if (t.rec < minRec) { minRec = t.rec; firstSeed = seed; } }
    }
    const par = LEVELS[idx].par;
    const bad = wins > 0;
    RESULTS.push({ idx, name: LEVELS[idx].name, n, wins, minRec, firstSeed, ok: !bad });
    html += '<span class="' + (bad ? "bad" : "ok") + '">' + (bad ? "WIN " : "none ") + (idx + 1) + " " + LEVELS[idx].name + ": " + wins + " of " + n + " trials won" + (bad ? ", fewest recordings " + minRec + " (par " + (par ? par.r : "?") + "), seed " + firstSeed : "") + "</span>\n";
  }
  document.getElementById("out").innerHTML = html;
</script>
</body>
</html>
